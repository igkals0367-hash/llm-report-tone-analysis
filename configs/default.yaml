ingest:
  start_date: 2023-01-01
  sleep_sec: 0.5            # 네이버 요청 간격(초)
  krx_sleep_sec: 1.0        # KRX 호출 간격(초)
universe:
  top_n: 200
pairs:
  max_gap_months: 6
  search_from: 2023-01-01
periods:
  baseline_start: 2023-07-01
  baseline_end: 2024-06-30
  validation_start: 2024-07-01
model:
  name: snunlp/KR-FinBert-SC
  revision: "f8586286cc3161fb648e9fee09a456069fd846d0"   # 2026-11-12 고정 (Step 5)
  max_tokens: 512
  batch_size: 32            # 한 번에 넣는 문장 수 (Step 5)
grade:
  lower_pct: 33.3
  upper_pct: 66.7
h1:
  window_months: 3          # Step 7 점검으로 고정 (2026-11-13)
precheck:                   # Step 7 판정 기준 (2026-11-13, 숫자를 보기 전에 결정)
  h1_min_share: 0.5         # 검증 R 중 3개월 안 다음 리포트 비율이 이 값 이상이면 3개월
  h1_alt_window_months: 4
  broker_top_k: 2
  broker_max_share: 0.5     # A나 C에서 상위 2곳 비중 합이 이 값을 넘으면 쏠림
  short_max_sentences: 2    # R이나 P의 문장 수(제목 포함)가 이 값 이하면 '아주 짧은 요약'
  short_ratio: 2.0          # 짧은 요약 쌍 비율이 A와 C 각각에서 B의 이 배수 이상이면 몰림
  broker_min_pairs: 30      # 증권사별 표준화에서 그 증권사의 표준편차를 쓸 최소 기준선 쌍 수
h2:
  horizon_days: 60
  aux_horizon_days: 20
  winsor_pct: 1
  aux_winsor_pct: 5
permutation:
  n: 1000
  seed: 20261111
  alpha: 0.05
backtest:
  long_weight: 0.5
  max_weight: 0.05   # 한 종목 비중 상한. 추가 분석에만 쓴다 (결과를 본 뒤 추가, 2026-11-13)
  short_weight: 0.5
  holding_days: 60
  alt_holding_days: [20, next_report]
  cost_roundtrip: 0.003
  borrow_rate_annual: 0.06
  trading_days_per_year: 252   # 공매도 이자 하루치, 샤프 연율화 (2026-11-13)
  verify_runs: 100             # 엔진 검증: 무작위 라벨 실행 횟수 (2026-11-13)
short_ban:
  start: 2023-11-06
  end: 2025-03-30
pairs:
  max_gap_months: 6
  search_from: 2023-01-01
  adj_tol: 0.001            # 기준가 조정일 판정: |원래 종가 변화 − ret| > 이 값 (16장)
pdf:                       # v2 Step 1b (19장)
  sleep_sec: 1.0           # 요청 사이 쉬는 시간(초)
  timeout_sec: 60
  retries: 3               # 실패하면 간격을 늘려 가며 다시 시도하는 횟수
  min_hangul: 100          # 한글이 이보다 적으면 글자 없음 (스캔·깨진 PDF)
  max_symbol_ratio: 0.50   # (a) 숫자·기호(한글·영문이 아닌 글자) 비율이 이 이상이면 줄을 뺀다
  min_line_hangul: 10      # (a) 한글이 이보다 적고 . ? !로 끝나지 않으면 줄을 뺀다
  boilerplate_min_reports: 20   # (b) 서로 다른 리포트 이만큼에 나오는 문장은 정형 문구로 뺀다
